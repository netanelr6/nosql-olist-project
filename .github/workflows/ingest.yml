name: Load Data to MongoDB Atlas

on:
  push:
    branches:
      - main # Trigger pipeline on git push to the main branch
  workflow_dispatch: #  Allows manual trigger from the GitHub Actions UI

jobs:
  ingest_data:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up Python 3.10 environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Step 3: Install all required Python packages
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run the ETL Pipeline (Download data from Kaggle and ingest into MongoDB Atlas)
      - name: Run ETL Ingestion to MongoDB Atlas
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          python src/download_data.py
          python src/load_to_mongo.py
